[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netprobe"
version = "0.1.0"
description = "Dependency-free TCP recon that produces a graph, not a wall of text — async connect scan, banner/HTTP/TLS fingerprinting, and a normalized host-service graph."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nirry" }]
keywords = ["recon", "port-scanner", "network", "security", "fingerprint", "asyncio", "pentest", "osint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
netprobe = "netprobe.cli:main"

[project.urls]
Homepage = "https://nirry.net"
Source = "https://github.com/nirry-dev/netprobe"

[tool.hatch.build.targets.wheel]
packages = ["netprobe"]
